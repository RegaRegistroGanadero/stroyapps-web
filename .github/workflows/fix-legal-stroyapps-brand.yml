name: Fix legal StroyApps branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-legal-stroyapps-brand.yml'

permissions:
  contents: write

jobs:
  fix-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply StroyApps logo and home links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          old_wordmark = '<a class="wordmark" href="../../index.html"><span>S</span>StroyApps</a>'
          new_wordmark = '<a class="wordmark" href="../../index.html" aria-label="Ir a la página principal de StroyApps"><img src="../../images/stroyapps-logo-dark.svg" alt="StroyApps" style="width:190px;max-width:52vw;height:auto;display:block"></a>'

          changed = []
          for p in (root / 'apps').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              new = text.replace(old_wordmark, new_wordmark)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))

          old_brand = '<div class="brand">REGA · StroyApps</div>'
          new_brand = '<a class="brand" href="../../index.html" aria-label="Ir a la página principal de StroyApps" style="text-decoration:none;color:#fff"><img src="../../images/stroyapps-logo-dark.svg" alt="StroyApps" style="width:210px;max-width:62vw;height:auto;display:block"></a>'

          for rel in ['apps/rega/privacidad.html','apps/rega/eliminar-datos.html','apps/rega/eliminar-cuenta.html']:
              p = root / rel
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              new = text.replace(old_brand, new_brand)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  if str(p) not in changed:
                      changed.append(str(p))

          print('Archivos actualizados:')
          for item in changed:
              print('-', item)
          PY

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "REGA-RegistroGanadero"
          git config user.email "mazasarmientoarturo@gmail.com"
          git add apps
          git commit -m "Apply StroyApps logo and home links to legal pages"
          git push
